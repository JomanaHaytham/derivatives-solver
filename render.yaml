# Render Blueprint: New + > Blueprint > pick this repo.
services:
  - type: web
    name: deriveit
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # you paste the key in the Render dashboard; it never goes in the repo
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
